name: Generate Interruption Evidence

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Run Test Harness
      run: python testing-evidence-Nihal/scripts/test_interruption.py --runs 5
      
    - name: Generate Markdown Evidence
      run: python testing-evidence-Nihal/scripts/generate_evidence.py
